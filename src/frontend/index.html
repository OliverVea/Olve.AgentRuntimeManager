<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Olve.AgentRuntimeManager — messages</title>
    <style>
      :root {
        color-scheme: light dark;
        --edge: color-mix(in oklab, currentColor 14%, transparent);
      }
      body {
        font: 15px/1.5 system-ui, sans-serif;
        max-width: 46rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
      }
      header h1 {
        font-size: 1.4rem;
        margin: 0 0 0.25rem;
      }
      header p {
        margin: 0 0 1.5rem;
        opacity: 0.7;
      }
      details {
        margin: 0 0 1.5rem;
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 0.5rem 0.9rem;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      .auth-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.6rem;
        min-height: 2rem;
        margin: 0 0 1.5rem;
      }
      .auth-bar .who {
        opacity: 0.75;
        font-size: 0.9rem;
      }
      .auth-bar button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--edge);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        padding: 0.35rem 0.8rem;
      }
      .auth-bar button:hover {
        background: color-mix(in oklab, currentColor 8%, transparent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Messages</h1>
      <p>
        A vanilla Web Component (<code>&lt;message-list&gt;</code>) talking to the live
        <code>Olve.AgentRuntimeManager</code> through a TypeScript client generated from its
        TypeSpec contract.
      </p>
    </header>

    <!-- Log in / who's-logged-in + log out, populated by main.ts. GET is anonymous so the list
         loads either way; creating, editing and deleting need a login (OIDC + PKCE via Authentik). -->
    <div id="auth" class="auth-bar"></div>

    <message-list></message-list>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
