replicaCount: 1

image:
  repository: olve-arm
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  Host: "0.0.0.0"
  Port: "5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Auth__Authority: "https://auth.ovea.pro/application/o/olve-arm/"
  Auth__Audience: "olve-arm"
  # Public PKCE client the SPA logs in as (separate from the confidential client used for machine
  # tokens). Its tokens carry this provider's `iss` and an `aud` of its own client id, so
  # AuthenticationConfiguration trusts both issuers AND both audiences. The SPA reads these at
  # runtime from GET /api/auth-config. Defined as an Authentik blueprint in Olve.Authentik.
  Auth__Frontend__Authority: "https://auth.ovea.pro/application/o/olve-arm-spa/"
  Auth__Frontend__ClientId: "olve-arm-spa"
  OpenTelemetry__Endpoint: "https://otel.ovea.pro"
  OpenTelemetry__Protocol: "http"
  OpenTelemetry__OAuth2__TokenUrl: "https://auth.ovea.pro/application/o/token/"
  OpenTelemetry__OAuth2__ClientId: "otel"

secrets:
  - name: authentik-oidc-secrets
    envMap:
      # The OTLP exporter authenticates as the shared `otel` OAuth2 client, so its secret is the
      # `otel` client's own secret (key otel-client-secret), NOT this app's client secret.
      OpenTelemetry__OAuth2__ClientSecret: otel-client-secret

# Mounts the Authentik CA (shared `authentik-ca` configMap in the namespace) so the app trusts
# outbound TLS to *.ovea.pro (auth/OTel/OpenBao). Required in prod, where OTLP export authenticates
# via OAuth2 over HTTPS to auth.ovea.pro. values-beta.yaml overrides fileName for the beta CA.
authentikCa:
  enabled: true
  fileName: auth-prod-ca.crt

slo:
  enabled: true
  labels:
    owner: "oliver"
    tier: "2"
  objectives:
    availability:
      target: 99.9
      description: "HTTP requests should not return 5xx errors."
    latency:
      target: 99
      threshold: "0.5"
      description: "HTTP requests should complete within 500ms."
