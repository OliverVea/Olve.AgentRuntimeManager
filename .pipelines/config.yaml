# In-repo CD pipeline (GitOps) for this app, deployed by Olve.Pipelines.
#
# This file is the single source of truth for how this app is built and deployed.
# A pipeline is bound to this repo and the service reconciles the live pipeline to
# match this file on every change; pushing a commit deploys automatically (the
# deploy poll is configured by the binding — no trigger needs declaring here).
#
# Secrets are declared by NAME only; their values live in the pipeline's own k8s
# secret (olve-pipeline-{id}) and never in the repo. Steps reference them as
# ordinary env vars ($GITHUB_TOKEN, $SSH_PRIVATE_KEY) — they are mounted into
# every job.
#
# Build → beta → beta confirmation → prod. ARM runs in libvirt VMs on the homelab host
# (olve-arm-beta / olve-arm-prod, created on first deploy by src/deploy/vm/vm-deploy.sh), not in
# k8s: agents must survive server restarts. Routing lives in Olve.Homelab (`hostEndpoint` →
# the host relay → the VM). A failing step stops everything after it.
apiVersion: "0.0"
# `name` is GitOps config: reconcile applies it to the live pipeline.
name: Olve.AgentRuntimeManager
description: Build with Kaniko, deploy into homelab VMs (beta, confirm, then prod).
version: "1"

secrets:
  - name: GITHUB_TOKEN
    description: GitHub read token used to fetch the repo tarball during build.
  - name: SSH_PRIVATE_KEY
    description: SSH key for deploying to the homelab host (VM provisioning + releases).

# Production steps run in parallel and write to bundle/<step-name>/.
productionSteps:
  - name: build-and-package
    configuration:
      image: gcr.io/kaniko-project/executor:debug
      scriptFile: scripts/build.sh
  # Runs `mise run ci` (emitter conformance, backend unit + API tests, frontend lint/test/build, CLI
  # typecheck/test/build) in parallel with the build. If it fails, the production job group
  # fails and the deploy cascade never starts. Produces no version.txt, so the deploy scripts
  # ignore its bundle dir.
  - name: check
    configuration:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
      scriptFile: scripts/check.sh

# Processing steps run sequentially (order = list position), each receiving the
# bundle. deploy-beta runs first and gates deploy (prod).
processingSteps:
  - name: deploy-beta
    configuration:
      image: alpine:latest
      scriptFile: scripts/deploy-beta.sh
  # Beta confirmation: the API test suite against the live beta VM via the host relay (no
  # ingress dependency). Read/anonymous behaviour runs; token-dependent tests skip (beta
  # validates Authentik tokens, not a test key). A failure stops prod.
  - name: test-after-beta
    configuration:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
      scriptFile: scripts/test-after-beta.sh
  - name: deploy
    configuration:
      image: alpine:latest
      scriptFile: scripts/deploy.sh
