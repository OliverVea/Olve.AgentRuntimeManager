# Single entry point for humans, Claude and CI: pins the toolchain and runs the same tasks
# everywhere. Each task delegates to the project's native build (npm / dotnet).
[tools]
node = "24.14.0"
dotnet = "10.0.200"


# --- tasks -----------------------------------------------------------------------------------
# `mise run ci` is exactly what the pipeline's `check` step runs. Tasks run sequentially within
# `ci` because the per-project builds each regenerate the shared artifacts/.

[tasks.install]
description = "Install npm workspace dependencies (root lockfile)"
run = "npm ci"

[tasks.generate]
description = "TypeSpec → artifacts/spec/openapi.json + artifacts/generated/backend (C#) → artifacts/clients/ts"
run = "npm run generate"

[tasks."codegen:test"]
description = "Emitter tests: snapshots + the tooling conformance suite (fixture → C# → HTTP vs OpenAPI; runs dotnet)"
run = "npm run codegen:test"

[tasks."backend:test"]
description = "Backend build + unit and API tests (API tests in-process)"
dir = "src/backend"
run = ["dotnet build", "dotnet test"]

[tasks."api:image"]
description = "API tests against the real Docker image: builds and starts it, runs the suite in base-URL mode (needs Docker)"
dir = "src/backend"
run = """
#!/usr/bin/env bash
set -euo pipefail
image="olve-arm:api-test"
key="api-image-test-signing-key-that-is-long-enough"
docker build -t "$image" ../..
container=$(docker run -d -p 127.0.0.1::5000 -e Host=0.0.0.0 \
  -e Auth__SigningKey="$key" -e Auth__Authority=api-test -e Auth__Audience=api-test "$image")
trap 'docker rm -f "$container" >/dev/null' EXIT
url="http://$(docker port "$container" 5000/tcp | head -n1)"
for _ in $(seq 60); do curl -fs "$url/health" >/dev/null && break || sleep 1; done
ARM_API_BASE_URL="$url" ARM_API_SIGNING_KEY="$key" ARM_API_ISSUER=api-test ARM_API_AUDIENCE=api-test \
  dotnet test --project Olve.AgentRuntimeManager.ApiTests
"""

[tasks."frontend:check"]
description = "Frontend lint, tests, production build"
dir = "src/frontend"
run = ["npm run lint", "npm test", "npm run build"]

[tasks."cli:check"]
description = "CLI typecheck, tests, single-binary build"
dir = "src/cli"
run = ["npm run typecheck", "npm test", "npm run build"]

[tasks.ci]
description = "Everything the pipeline gate runs"
run = [
  { task = "install" },
  { task = "generate" },
  { task = "codegen:test" },
  { task = "backend:test" },
  { task = "frontend:check" },
  { task = "cli:check" },
]
